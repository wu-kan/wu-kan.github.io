title: 별의 합창 # 사이트 제목
description: Kan Wu의 개인 블로그
baseurl: "" # 블로그가 특정 디렉토리에 구축된 경우, 여기에 디렉토리명을 추가하세요. 아래 설정된 모든 링크의 `/assets` 앞에도 추가해야 합니다. 예: `/your_baseurl/assets`. 이 설정의 끝에는 '/'를 넣지 마세요.

defaults: # 모든 설정 옵션을 <https://jekyllrb.com/docs/configuration/front-matter-defaults/> 기능을 사용하여 구성
  - scope:
      path: "" # 빈 문자열은 프로젝트의 모든 파일을 의미함
    values: # 다음 설정 항목은 개별 페이지에서 사용자 정의할 수도 있음
      jekyll-theme-WuK: # 내 테마의 사용자 정의 스타일은 이 네임스페이스에서 설정됨
        comments: # 댓글 페이지, 여기를 수정하여 본인의 저장소를 사용하도록 설정하세요! 참고: <https://giscus.app/>
          append: |
            <div class="giscus">
              댓글 불러오는 중...
            </div>
            <script src="https://giscus.app/client.js"
              data-repo="wu-kan/wu-kan.github.io"
              data-repo-id="MDEwOlJlcG9zaXRvcnkxNzIxMzc1OTQ="
              data-category="공지사항"
              data-category-id="DIC_kwDOCkKces4Clz9j"
              data-mapping="url"
              data-strict="0"
              data-reactions-enabled="1"
              data-emit-metadata="0"
              data-input-position="top"
              data-theme="preferred_color_scheme"
              data-lang="ko"
              crossorigin="anonymous"
              async>
            </script>
        default:
          html_lang: ko # <https://www.w3school.com.cn/tags/html_ref_language_codes.asp>
          color-mode: auto # <https://primer.style/css/storybook/?path=/docs/support-theming--docs>
          light-theme: light
          dark-theme: dark
          menu:
            nav: # 내비게이션 메뉴, 원하는 링크를 추가할 수 있음
              - title: '홈 / Index'
                href: /
              - title: '댓글 / Comments'
                href: /comments/
              - title: '아카이브 / Archive'
                href: /archive/
              - title: '태그 / Tags'
                href: /tags/
              - title: '기부 / Donate'
                href: /donate/
              - title: '이력서 / Resume'
                href: https://resume.wu-kan.cn/
              - title: 'GitHub'
                href: https://github.com/wu-kan
              - title: 'Bilibili'
                href: https://space.bilibili.com/166390020
              - title: 'Zhihu'
                href: https://www.zhihu.com/people/wukan0621
              - title: 'Google Scholar'
                href: https://scholar.google.com/citations?user=aU9P37UAAAAJ
              - title: 'Vjudge'
                href: https://vjudge.net/user/WuK
              - title: 'jekyll-theme-WuK'
                href: https://jekyll-theme-WuK.wu-kan.cn/
            footer: | # 페이지 방문 통계
              <div>
                <span id="busuanzi_container_site_pv">
                  <span id="busuanzi_value_site_pv"></span>
                  방문
                </span>
                <span id="busuanzi_container_site_uv">
                  <span id="busuanzi_value_site_uv"></span>
                  방문자
                </span>
                <script
                  src="https://cdn.jsdelivr.net/npm/busuanzi@2.3/bsz.pure.mini.js"
                  async="async"
                ></script>
              </div>
              <div>
                (C) 2017-2025 wu-kan
              </div>
            jekyll-toc: # <https://github.com/allejo/jekyll-toc>
              enable: true
              prepend: |
                <style>
                  #wrap-toc {
                    padding-left: 3em;
                  }
                </style>

compress_html: # <https://github.com/penibelst/jekyll-compress-html>
  clippings: all
  comments: [] # 주석을 압축하면 reveal.js 슬라이드 전환이 영향을 받을 수 있음
  endings: all
  ignore:
    envs: all # '[]'로 설정하면 syntax_highlighter_opts line_numbers true 관련 오류 발생 가능
  blanklines: false
  profile: false
  startings: []

# GitHub Pages에서 지원하는 플러그인은 <https://pages.github.com/versions/> 참조
plugins: # <https://jekyllrb.com/docs/plugins/>
  - jekyll-readme-index # README.md를 index로 사용하여 GitHub 렌더링과 동일한 효과 제공
  - jekyll-default-layout # 각 Markdown 파일에 기본 레이아웃 자동 생성
  - jekyll-seo-tag # 각 페이지에 SEO 태그 자동 추가
  - jekyll-sitemap # 사이트 맵 생성
  - jekyll-feed # RSS 피드 생성
  - jekyll-redirect-from # 페이지 리디렉션 지원
  - jekyll-paginate
  - jekyll-remote-theme # 원격 테마 지원 (프론트엔드와 백엔드 분리) <https://github.com/benbalter/jekyll-remote-theme/>

remote_theme: https://github.com/wu-kan/jekyll-theme-WuK
WuK@5.4.0 # 특정 버전 고정 (테마 업데이트로 인해 사이트가 깨지는 것을 방지)

paginate: 10  
paginate_path: "/assets/history/:num/"  

readme_index: # `index.md` 또는 `index.html`이 없을 때 `README.md`를 대신 사용  
  with_frontmatter: true # YAML 헤더가 포함된 README도 지원  

webmaster_verifications: # <https://jekyll.github.io/jekyll-seo-tag/usage/>  
  google: YIKi1rBnyUaS-DMYiluseI5kZzTwjCkTFmKkSkMZDJk  
  baidu: szbTSfUGAB  

permalink: pretty  # URL을 깔끔하게 설정  
timezone: Asia/Shanghai # GitHub Pages에서 시간 표시 오류 해결 (<https://www.iana.org/time-zones>)  
future: true # 미래 날짜로 설정된 게시글도 허용  

# limit_posts: 999 # 표시할 게시글 수 제한  
# encoding: utf-8  

markdown: kramdown  
kramdown: # 설정 참조: <https://kramdown.gettalong.org/options.html>  
  input: GFM # GitHub Flavored Markdown 사용 (<http://jekyllcn.com/docs/configuration/#kramdown>)  
  syntax_highlighter_opts: # 코드 하이라이팅 옵션 (<https://kramdown.gettalong.org/syntax_highlighter/rouge.html>)  
    block:  
      disable: false  
      line_numbers: true  
    span:  
      disable: false  

# 아래 설정들은 GitHub Pages에서 변경할 수 없음 (<https://help.github.com/en/github/working-with-github-pages/about-github-pages-and-jekyll>)  
#lsi: false # 관련 글 색인 생성  
#safe: true # 사용자 정의 플러그인 비활성화  
#source: [your repo's top level directory] # Jekyll이 파일을 읽을 경로  
#incremental: false # 점진적 빌드 활성화 여부  
#highlighter: rouge # 코드 하이라이터  
#gist:  
#  noscript: false  
#kramdown:  
#  math_engine: mathjax  
#  syntax_highlighter: rouge  
